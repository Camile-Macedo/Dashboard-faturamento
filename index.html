<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faturamento Gestão</title></head>
<body style="font-family:Arial,sans-serif;padding:24px">Carregando painel...</body>
<script>
(async()=>{
  try{
    let html='';
    for(let i=1;i<=10;i++){
      const n=String(i).padStart(2,'0');
      const r=await fetch(`app/part${n}.txt?v=1`,{cache:'no-store'});
      if(!r.ok) throw new Error(`Falha ao carregar parte ${n}`);
      html+=await r.text();
    }
    document.open(); document.write(html); document.close();
  }catch(e){
    document.body.innerHTML='<h2>Não foi possível carregar o painel</h2><p>'+String(e.message||e)+'</p>';
  }
})();
</script>
</html>
